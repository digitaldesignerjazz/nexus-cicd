name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      source-path:
        description: Directory or file to compile
        type: string
        required: false
        default: "src"
      runner:
        description: GitHub-hosted or self-hosted runner label
        type: string
        required: false
        default: "ubuntu-latest"

jobs:
  python:
    name: Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Validate python-version
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          case "${PYTHON_VERSION}" in
            3.11|3.12|3.13) ;;
            *)
              echo "unsupported python-version: ${PYTHON_VERSION}"
              echo "allowed: 3.11, 3.12, 3.13"
              exit 1
              ;;
          esac
          echo "python-version accepted: ${PYTHON_VERSION}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source-path
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          set -euo pipefail
          case "${SOURCE_PATH}" in
            ""|/*|*..*|*/*/*|*" "*)
              echo "rejected path: ${SOURCE_PATH}"
              echo "need a relative path, no .., no spaces, at most one slash"
              exit 1
              ;;
          esac
          if [ -d "${SOURCE_PATH}" ] || [ -f "${SOURCE_PATH}" ]; then
            echo "source-path accepted: ${SOURCE_PATH}"
          else
            echo "source-path missing (${SOURCE_PATH}) — compile will skip"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Compile & run reference layer
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -d "${SOURCE_PATH}" ]; then
            find "${SOURCE_PATH}" -name '*.py' -print0 | xargs -0 python -m py_compile
          elif [ -f "${SOURCE_PATH}" ]; then
            python -m py_compile "${SOURCE_PATH}"
          else
            echo "No Python sources at ${SOURCE_PATH} — skip compile."
          fi
          if [ -f src/nexus_cicd.py ]; then
            python src/nexus_cicd.py
          fi
          echo "✓ Python layer integrity confirmed"
