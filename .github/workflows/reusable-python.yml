name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      source-path:
        description: Directory or file to compile
        type: string
        required: false
        default: "src"
      runner:
        description: GitHub-hosted or self-hosted runner label
        type: string
        required: false
        default: "ubuntu-latest"
      enable-pip-cache:
        description: Enable setup-python pip cache (needs a lockfile)
        type: boolean
        required: false
        default: false
      cache-dependency-path:
        description: Lockfile used as cache key
        type: string
        required: false
        default: "requirements.txt"

jobs:
  python:
    name: Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate python-version
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          case "${PYTHON_VERSION}" in
            3.11|3.12|3.13) ;;
            *)
              echo "unsupported python-version: ${PYTHON_VERSION}"
              echo "allowed: 3.11, 3.12, 3.13"
              exit 1
              ;;
          esac
          echo "python-version accepted: ${PYTHON_VERSION}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source-path
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          set -euo pipefail
          case "${SOURCE_PATH}" in
            ""|/*|*..*|*/*/*|*" "*)
              echo "rejected path: ${SOURCE_PATH}"
              echo "need a relative path, no .., no spaces, at most one slash"
              exit 1
              ;;
          esac
          if [ -d "${SOURCE_PATH}" ] || [ -f "${SOURCE_PATH}" ]; then
            echo "source-path accepted: ${SOURCE_PATH}"
          else
            echo "source-path missing (${SOURCE_PATH}) — compile will skip"
          fi

      - name: Cache identity
        if: ${{ inputs.enable-pip-cache }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          printf '%s\n' "${PYTHON_VERSION}" > .python-version
          echo "cache identity: ${PYTHON_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.enable-pip-cache && 'pip' || '' }}
          cache-dependency-path: |
            ${{ inputs.cache-dependency-path }}
            .python-version

      - name: Install from lockfile
        if: ${{ inputs.enable-pip-cache }}
        env:
          LOCKFILE: ${{ inputs.cache-dependency-path }}
        run: |
          set -euo pipefail
          if [ ! -f "${LOCKFILE}" ]; then
            echo "no lockfile at ${LOCKFILE} — skip install"
            exit 0
          fi
          if grep -Eqv '^[[:space:]]*(#|$)' "${LOCKFILE}"; then
            python -m pip install --upgrade pip
            python -m pip install -r "${LOCKFILE}"
          else
            echo "lockfile has no pins — skip pip install"
          fi

      - name: Compile & run reference layer
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          set -euo pipefail
          if [ -d "${SOURCE_PATH}" ]; then
            find "${SOURCE_PATH}" -name '*.py' -print0 | xargs -0 python -m py_compile
          elif [ -f "${SOURCE_PATH}" ]; then
            python -m py_compile "${SOURCE_PATH}"
          else
            echo "No Python sources at ${SOURCE_PATH} — skip compile."
          fi
          if [ -f src/nexus_cicd.py ]; then
            python src/nexus_cicd.py
          fi
          echo "✓ Python layer integrity confirmed"
