name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      source-path:
        description: Directory or file to compile
        type: string
        required: false
        default: "src"
      runner:
        description: GitHub-hosted or self-hosted runner label
        type: string
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Detect dependency file
        id: deps
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "cache=pip" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ steps.deps.outputs.cache }}

      - name: Compile and run reference layer
        run: |
          set -euo pipefail
          src="${{ inputs.source-path }}"
          if [ -d "$src" ]; then
            mapfile -t files < <(find "$src" -name '*.py' -type f)
            if [ ${#files[@]} -gt 0 ]; then
              python -m py_compile "${files[@]}"
            else
              echo "No Python sources in $src — skip compile."
            fi
          elif [ -f "$src" ]; then
            python -m py_compile "$src"
          else
            echo "No Python sources at $src — skip compile."
          fi
          if [ -f src/nexus_cicd.py ]; then
            python src/nexus_cicd.py
          fi
          echo "Python layer integrity confirmed"
