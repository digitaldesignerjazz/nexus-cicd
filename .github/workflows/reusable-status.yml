name: Reusable Resonance Summary

on:
  workflow_call:
    inputs:
      python-result:
        type: string
        required: true
      extra-result:
        type: string
        required: false
        default: "success"
      extra-label:
        type: string
        required: false
        default: "Extra"

jobs:
  summary:
    name: Nexus Resonance Summary
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        env:
          PYTHON_RESULT: ${{ inputs.python-result }}
          EXTRA_RESULT: ${{ inputs.extra-result }}
          EXTRA_LABEL: ${{ inputs.extra-label }}
        run: |
          set -euo pipefail
          echo "Nexus CI/CD completed."
          echo "Python layer: ${PYTHON_RESULT}"
          echo "${EXTRA_LABEL}: ${EXTRA_RESULT}"

          allowed='success|failure|cancelled|skipped'
          case "${PYTHON_RESULT}" in
            success|failure|cancelled|skipped) ;;
            *) echo "invalid python-result: ${PYTHON_RESULT} (allowed: ${allowed})"; exit 1 ;;
          esac
          case "${EXTRA_RESULT}" in
            success|failure|cancelled|skipped) ;;
            *) echo "invalid extra-result: ${EXTRA_RESULT} (allowed: ${allowed})"; exit 1 ;;
          esac

          ok() { [ "$1" = success ]; }
          if ok "${PYTHON_RESULT}" && ok "${EXTRA_RESULT}"; then
            echo "✓ The lattice holds. Resonance confirmed."
          else
            echo "⚠ One or more layers need attention."
            exit 1
          fi
